<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorIA</title>
    <style>
        body { background-color: #0d0d1a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .contenedor { background-color: #121226; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h3 { text-align: center; color: #e91e63; margin-bottom: 20px; }
        .pestanas { display: flex; gap: 5px; margin-bottom: 15px; }
        .pestana-btn { padding: 8px; font-size: 11px; flex: 1; background-color: #333; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .pestana-active { background-color: #e91e63; }
        textarea { width: 100%; padding: 10px; background-color: #1a1a3a; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 15px; }
        .acciones { display: flex; gap: 10px; }
        button#btnRegistrar { flex: 2; padding: 12px; background-color: #e91e63; color: white; border: none; border-radius: 8px; font-weight: bold; }
        label#btnCamara { flex: 1; background-color: #009688; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h3>¡Hola, !</h3>
    
    <div class="pestanas">
        <button class="pestana-btn pestana-active" onclick="seleccionarPestana(this, 'Desayuno')">Desayuno</button>
        <button class="pestana-btn" onclick="seleccionarPestana(this, 'Almuerzo')">Almuerzo</button>
        <button class="pestana-btn" onclick="seleccionarPestana(this, 'Cena')">Cena</button>
        <button class="pestana-btn" onclick="seleccionarPestana(this, 'Merienda')">Merienda</button>
    </div>

    <textarea id="txtComidaIA" rows="3" placeholder="Describe tu comida..."></textarea>

    <div class="acciones">
        <button id="btnRegistrar" onclick="registrar()">Registrar</button>
        <label id="btnCamara">📷
            <input type="file" accept="image/*" onchange="registrarFoto(event)" style="display: none;">
        </label>
    </div>
</div>

<script>
    let categoria = 'Desayuno';
    let historial = JSON.parse(localStorage.getItem('historial_comidas')) || {};

    function seleccionarPestana(btn, cat) {
        categoria = cat;
        document.querySelectorAll('.pestana-btn').forEach(b => b.classList.remove('pestana-active'));
        btn.classList.add('pestana-active');
    }

    function registrar() {
        let fecha = new Date().toISOString().split('T')[0];
        if (!historial[fecha]) historial[fecha] = [];
        historial[fecha].push({ cat: categoria, desc: document.getElementById('txtComidaIA').value });
        localStorage.setItem('historial_comidas', JSON.stringify(historial));
        verificarResumen();
        document.getElementById('txtComidaIA').value = '';
    }

    function registrarFoto(e) {
        if (e.target.files[0]) registrar();
    }

    function verificarResumen() {
        let f = new Date();
        if (f.getDay() === 0) console.log("Resumen semanal generado");
        if (f.getDate() >= 30) console.log("Resumen mensual generado");
    }
</script>

</body>
</html>
