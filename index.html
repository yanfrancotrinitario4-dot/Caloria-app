<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorIA - Control de Peso Inteligente</title>
    <style>
        :root { --bg-principal: #0d0d1a; --bg-tarjeta: #121226; --texto: #ffffff; --texto-secundario: #aaa; --primario: #e91e63; --borde: #2d2d5a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto); padding: 20px; display: flex; justify-content: center; }
        .contenedor-app { width: 100%; max-width: 400px; background-color: var(--bg-tarjeta); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h3, h4 { text-align: center; color: var(--primario); margin-bottom: 15px; }
        .oculto { display: none !important; }
        .grupo-entrada { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--texto-secundario); }
        input, select, textarea { width: 100%; padding: 10px; background-color: #1a1a3a; border: 1px solid #333; border-radius: 8px; color: white; }
        button { width: 100%; padding: 12px; background-color: var(--primario); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .metricas-salud { display: flex; gap: 10px; margin-bottom: 20px; }
        .tarjeta-metrica { flex: 1; background-color: #1a1a3a; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; border: 1px solid var(--borde); }
        .tarjeta-metrica span { display: block; font-size: 16px; font-weight: bold; color: #00bcd4; margin-top: 5px; }
        .resumen-calorias { text-align: center; margin-bottom: 20px; background-color: #1a1a3a; padding: 15px; border-radius: 12px; border: 1px solid var(--borde); }
        .numero-calorias { font-size: 36px; font-weight: bold; color: var(--primario); margin: 5px 0; }
        .macro-linea { margin-bottom: 12px; }
        .macro-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .barra-progreso-bg { background-color: #222; border-radius: 6px; height: 8px; width: 100%; overflow: hidden; }
        .barra-progreso-fill { height: 100%; width: 0%; transition: width 0.4s ease; }
        .p-fill { background-color: var(--primario); } .c-fill { background-color: #00bcd4; } .g-fill { background-color: #ff9800; }
        .item-comida { background-color: #1a1a3a; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 13px; }
        .tarjeta-reporte { background: #1a1a3a; border: 1px solid var(--borde); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="contenedor-app">
    <!-- PANTALLA 1: PERFIL -->
    <div id="pantallaPerfil">
        <h3>Configuración de Perfil</h3>
        <div class="grupo-entrada"><label>Nombre:</label><input type="text" id="perfilNombre"></div>
        <div class="grupo-entrada"><label>Edad:</label><input type="number" id="perfilEdad"></div>
        <div class="grupo-entrada"><label>Altura (cm):</label><input type="number" id="perfilAltura"></div>
        <div class="grupo-entrada"><label>Peso (kg):</label><input type="number" id="perfilPeso"></div>
        <div class="grupo-entrada">
            <label>Nivel de Actividad:</label>
            <select id="perfilActividad">
                <option value="1.2">Sedentario</option>
                <option value="1.375">Ligero</option>
                <option value="1.55">Moderado</option>
                <option value="1.725">Fuerte</option>
            </select>
        </div>
        <button onclick="guardarPerfil()">Guardar y Comenzar</button>
    </div>

    <!-- PANTALLA 2: DASHBOARD (Mantiene toda tu estética anterior) -->
    <div id="pantallaDashboard" class="oculto">
        <h3 id="saludoUsuario">¡Hola!</h3>
        <div class="metricas-salud">
            <div class="tarjeta-metrica">IMC<span id="valIMC">--.-</span></div>
            <div class="tarjeta-metrica">Gasto Est.<span id="valGasto">----</span></div>
            <div class="tarjeta-metrica">Meta<span id="valMeta">----</span></div>
        </div>
        <div class="resumen-calorias">
            <div class="numero-calorias" id="calTotales">0</div>
            <div class="subtitulo-calorias" id="txtProgresoPorcentaje">0% de tu meta</div>
        </div>
        <!-- Macros -->
        <div class="macro-linea"><div class="macro-info"><span>Proteína</span><span id="txtP">0g</span></div><div class="barra-progreso-bg"><div id="barP" class="barra-progreso-fill p-fill"></div></div></div>
        <div class="macro-linea"><div class="macro-info"><span>Carbos</span><span id="txtC">0g</span></div><div class="barra-progreso-bg"><div id="barC" class="barra-progreso-fill c-fill"></div></div></div>
        <div class="macro-linea"><div class="macro-info"><span>Grasas</span><span id="txtG">0g</span></div><div class="barra-progreso-bg"><div id="barG" class="barra-progreso-fill g-fill"></div></div></div>
        
        <div id="listaComidasHoy"></div>
        <button onclick="procesarComidaIA()">Registrar Comida</button>
    </div>

    <!-- NAVEGACIÓN -->
    <div id="navegacionApp" class="oculto">
        <button onclick="borrarDatos()" style="background:#333;">Restablecer Todo</button>
    </div>
</div>

<script>
    let datosUsuario = JSON.parse(localStorage.getItem('caloria_perfil')) || null;
    let registrosDiarios = JSON.parse(localStorage.getItem('caloria_registros')) || { calorias: 0, p: 0, c: 0, g: 0, comidas: [] };

    window.onload = () => { if (datosUsuario) mostrarDashboard(); };

    function guardarPerfil() {
        const edad = parseInt(document.getElementById('perfilEdad').value);
        const altura = parseInt(document.getElementById('perfilAltura').value);
        const peso = parseFloat(document.getElementById('perfilPeso').value);
        const factor = parseFloat(document.getElementById('perfilActividad').value);

        // Cálculo TMB (Mifflin-St Jeor) y Meta automática
        let tmb = Math.round((10 * peso) + (6.25 * altura) - (5 * edad) + 5);
        let meta = Math.round(tmb * factor);
        let imc = (peso / ((altura / 100) ** 2)).toFixed(1);

        datosUsuario = { nombre: document.getElementById('perfilNombre').value, edad, altura, peso, meta, imc, gastoEst: tmb };
        localStorage.setItem('caloria_perfil', JSON.stringify(datosUsuario));
        mostrarDashboard();
    }

    function mostrarDashboard() {
        document.getElementById('pantallaPerfil').classList.add('oculto');
        document.getElementById('pantallaDashboard').classList.remove('oculto');
        document.getElementById('navegacionApp').classList.remove('oculto');
        document.getElementById('valIMC').innerText = datosUsuario.imc;
        document.getElementById('valGasto').innerText = datosUsuario.gastoEst;
        document.getElementById('valMeta').innerText = datosUsuario.meta;
        actualizarGraficos();
    }

    function actualizarGraficos() {
        document.getElementById('calTotales').innerText = registrosDiarios.calorias;
        // ... (resto de funciones de actualización igual a tu versión anterior)
    }

    function borrarDatos() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
