<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorIA - Control Inteligente</title>
    <style>
        :root { --bg-principal: #121212; --bg-tarjeta: #1e1e1e; --texto: #ffffff; --texto-secundario: #aaaaaa; --primario: #009688; --borde: #333333; }
        body { background-color: var(--bg-principal); color: var(--texto); padding: 15px; display: flex; justify-content: center; font-family: sans-serif; }
        .contenedor-app { width: 100%; max-width: 480px; background-color: var(--bg-tarjeta); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); min-height: 90vh; }
        .oculto { display: none !important; }
        .grupo-input { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--borde); background-color: var(--bg-principal); color: var(--texto); }
        button { width: 100%; padding: 12px; background-color: var(--primario); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .resumen-calorias { text-align: center; margin: 20px 0; }
        .numero-calorias { font-size: 36px; color: var(--primario); font-weight: bold; }
        .barra-progreso-bg { background-color: #333; height: 8px; border-radius: 4px; margin: 5px 0 15px; }
        .barra-progreso-fill { height: 100%; width: 0%; transition: width 0.4s ease; border-radius: 4px; }
        .p-fill { background-color: #ff5722; } .c-fill { background-color: #4caf50; } .g-fill { background-color: #ffeb3b; }
        .item-comida { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--borde); font-size: 14px; }
    </style>
</head>
<body>

<div class="contenedor-app">
    <div id="pantallaOnboarding">
        <h2>Configuración CalorIA</h2>
        <div class="grupo-input"><label>Edad</label><input type="number" id="inputEdad" placeholder="21"></div>
        <div class="grupo-input"><label>Sexo</label><select id="inputSexo"><option value="masculino">Masculino</option><option value="femenino">Femenino</option></select></div>
        <div class="grupo-input"><label>Peso (kg)</label><input type="number" id="inputPeso" step="0.1" placeholder="107"></div>
        <div class="grupo-input"><label>Estatura (metros)</label><input type="number" id="inputAltura" step="0.01" placeholder="1.75"></div>
        <div class="grupo-input"><label>Actividad</label><select id="inputActividad"><option value="1.2">Sedentario</option><option value="1.375">Ligero</option><option value="1.55">Moderado</option><option value="1.725">Fuerte</option></select></div>
        <button onclick="guardarPerfil()">Iniciar CalorIA</button>
    </div>

    <div id="pantallaDashboard" class="oculto">
        <h3>Dashboard Diario</h3>
        <div class="resumen-calorias">
            <div id="caloriasRestantes" class="numero-calorias">0</div>
            <div style="font-size: 12px; color: var(--texto-secundario);">kcal restantes de tu Gasto Energético Total</div>
        </div>
        <div id="contenedorMacros">
            <div class="macro-linea">Proteínas <span id="txtProteina">0/0g</span><div class="barra-progreso-bg"><div id="barraP" class="barra-progreso-fill p-fill"></div></div></div>
            <div class="macro-linea">Carbohidratos <span id="txtCarbo">0/0g</span><div class="barra-progreso-bg"><div id="barraC" class="barra-progreso-fill c-fill"></div></div></div>
            <div class="macro-linea">Grasas <span id="txtGrasa">0/0g</span><div class="barra-progreso-bg"><div id="barraG" class="barra-progreso-fill g-fill"></div></div></div>
        </div>
        <div id="listaComidas" style="margin-top: 15px;"></div>
        <textarea id="txtComidaIA" style="width: 100%; height: 60px; margin-top: 15px; background: #000; color: #fff; border: 1px solid var(--borde); padding: 10px;" placeholder="Ej: Dos huevos y una taza de arroz..."></textarea>
        <button onclick="procesarComidaIA()">Registrar con IA</button>
    </div>
</div>

<script>
    const hoy = new Date().toISOString().split('T')[0];
    let datosUsuario = JSON.parse(localStorage.getItem('caloria_perfil'));
    let registros = JSON.parse(localStorage.getItem('caloria_registros')) || { fecha: hoy, calorias: 0, p: 0, c: 0, g: 0, comidas: [] };

    if (registros.fecha !== hoy) registros = { fecha: hoy, calorias: 0, p: 0, c: 0, g: 0, comidas: [] };

    function guardarPerfil() {
        const ed = parseInt(document.getElementById('inputEdad').value), sx = document.getElementById('inputSexo').value, pe = parseFloat(document.getElementById('inputPeso').value), al = parseFloat(document.getElementById('inputAltura').value), ac = parseFloat(document.getElementById('inputActividad').value);
        const tmb = (sx === 'masculino') ? (88.362 + (13.397 * pe) + (4.799 * (al * 100)) - (5.677 * ed)) : (447.593 + (9.247 * pe) + (3.098 * (al * 100)) - (4.330 * ed));
        const getd = Math.round(tmb * ac);
        datosUsuario = { getd, macros: { p: Math.round((getd * 0.3) / 4), c: Math.round((getd * 0.4) / 4), g: Math.round((getd * 0.3) / 9) } };
        localStorage.setItem('caloria_perfil', JSON.stringify(datosUsuario));
        location.reload();
    }

    function procesarComidaIA() {
        const input = document.getElementById('txtComidaIA');
        const desc = input.value.trim();
        if (!desc) return;

        // "IA" Lógica de análisis de patrones
        let cal = 200, p = 10, c = 20, g = 5;
        const txt = desc.toLowerCase();
        if (txt.includes('huevo') || txt.includes('pollo') || txt.includes('carne')) { cal = 300; p = 30; c = 0; g = 10; }
        else if (txt.includes('arroz') || txt.includes('pan') || txt.includes('avena')) { cal = 250; p = 5; c = 50; g = 1; }

        registros.calorias += cal; registros.p += p; registros.c += c; registros.g += g;
        registros.comidas.push({ desc, cal });
        localStorage.setItem('caloria_registros', JSON.stringify(registros));
        input.value = '';
        actualizarUI();
    }

    function actualizarUI() {
        document.getElementById('caloriasRestantes').innerText = Math.max(0, datosUsuario.getd - registros.calorias);
        document.getElementById('txtProteina').innerText = `${registros.p}/${datosUsuario.macros.p}g`;
        document.getElementById('txtCarbo').innerText = `${registros.c}/${datosUsuario.macros.c}g`;
        document.getElementById('txtGrasa').innerText = `${registros.g}/${datosUsuario.macros.g}g`;
        
        document.getElementById('barraP').style.width = Math.min((registros.p / datosUsuario.macros.p) * 100, 100) + '%';
        document.getElementById('barraC').style.width = Math.min((registros.c / datosUsuario.macros.c) * 100, 100) + '%';
        document.getElementById('barraG').style.width = Math.min((registros.g / datosUsuario.macros.g) * 100, 100) + '%';

        const lista = document.getElementById('listaComidas');
        lista.innerHTML = '';
        registros.comidas.forEach(i => {
            const div = document.createElement('div'); div.className = 'item-comida';
            div.innerHTML = `<span>${i.desc}</span><strong>${i.cal} kcal</strong>`;
            lista.appendChild(div);
        });
    }

    if (datosUsuario) {
        document.getElementById('pantallaOnboarding').classList.add('oculto');
        document.getElementById('pantallaDashboard').classList.remove('oculto');
        actualizarUI();
    }
</script>
</body>
</html>
