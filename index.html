    
        <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorIA - Control de Peso Inteligente</title>
    <style>
        :root {
            --bg-principal: #121212;
            --bg-tarjeta: #1e1e1e;
            --texto: #ffffff;
            --texto-secundario: #aaaaaa;
            --primario: #009688;
            --primario-hover: #00796b;
            --borde: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .contenedor-app {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-tarjeta);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        h2, h3 {
            color: var(--texto);
            margin-bottom: 15px;
            text-align: center;
        }

        .oculto {
            display: none !important;
        }

        /* PANTALLA DE REGISTRO / ONBOARDING */
        .pantalla-onboarding {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .grupo-input {
            margin-bottom: 15px;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 5px;
            color: var(--texto-secundario);
            font-size: 14px;
        }

        .grupo-input input, .grupo-input select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            background-color: var(--bg-principal);
            color: var(--texto);
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primario);
            color: var(--texto);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primario-hover);
        }

        /* DASHBOARD PRINCIPAL */
        .resumen-calorias {
            background-color: var(--bg-principal);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--borde);
        }

        .numero-calorias {
            font-size: 36px;
            font-weight: bold;
            color: var(--primario);
            margin: 10px 0;
        }

        .subtitulo-calorias {
            font-size: 12px;
            color: var(--texto-secundario);
        }

        .metricas-salud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .tarjeta-metrica {
            flex: 1;
            background-color: var(--bg-principal);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            border: 1px solid var(--borde);
        }

        .tarjeta-metrica span {
            display: block;
            font-weight: bold;
            color: var(--primario);
            font-size: 15px;
            margin-top: 5px;
        }

        /* BARRA DE MACROS */
        .contenedor-macros {
            background-color: var(--bg-principal);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--borde);
        }

        .macro-linea {
            margin-bottom: 10px;
        }

        .macro-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .barra-progreso-bg {
            background-color: #333;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .barra-progreso-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .p-fill { background-color: #ff5722; }
        .c-fill { background-color: #4caf50; }
        .g-fill { background-color: #ffeb3b; }

        /* REGISTRO DE COMIDAS */
        .seccion-registro {
            margin-top: auto;
        }

        .textarea-ia {
            width: 100%;
            height: 80px;
            padding: 12px;
            background-color: var(--bg-principal);
            color: var(--texto);
            border: 1px solid var(--borde);
            border-radius: 8px;
            resize: none;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .lista-comidas {
            margin-bottom: 20px;
            max-height: 160px;
            overflow-y: auto;
            border-radius: 8px;
        }

        .item-comida {
            background-color: var(--bg-principal);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primario);
            font-size: 14px;
        }

        .item-comida p {
            font-size: 12px;
            color: var(--texto-secundario);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="contenedor-app">
    
    <div id="pantallaOnboarding" class="pantalla-onboarding">
        <h2>Bienvenido a CalorIA</h2>
        <p style="text-align: center; color: var(--texto-secundario); margin-bottom: 20px; font-size: 14px;">
            Configura tu perfil para calcular tus metas personalizadas.
        </p>
        
        <div class="grupo-input">
            <label for="inputEdad">Edad (años)</label>
            <input type="number" id="inputEdad" placeholder="Ej. 21" min="1">
        </div>

        <div class="grupo-input">
            <label for="inputSexo">Sexo biológico</label>
            <select id="inputSexo">
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
            </select>
        </div>

        <div class="grupo-input">
            <label for="inputPeso">Peso actual (kg)</label>
            <input type="number" id="inputPeso" placeholder="Ej. 107" step="0.1">
        </div>

        <div class="grupo-input">
            <label for="inputAltura">Estatura (metros)</label>
            <input type="number" id="inputAltura" placeholder="Ej. 1.75" step="0.01">
        </div>

        <div class="grupo-input">
            <label for="inputActividad">Nivel de Actividad</label>
            <select id="inputActividad">
                <option value="1.2">Sedentario (Poco ejercicio)</option>
                <option value="1.375">Ligero (1-3 días/semana)</option>
                <option value="1.55">Moderado (3-5 días/semana)</option>
                <option value="1.725">Fuerte (6-7 días/semana)</option>
            </select>
        </div>

        <button onclick="guardarPerfil()">Calcular mis Metas</button>
    </div>

    <div id="pantallaDashboard" class="oculto">
        <h3>CalorIA Dashboard</h3>
        
        <div class="metricas-salud">
            <div class="tarjeta-metrica">IMC <span id="txtIMC">0.0</span></div>
            <div class="tarjeta-metrica">Gasto Basal <span id="txtTMB">0</span></div>
            <div class="tarjeta-metrica">Meta Diaria <span id="txtMeta">0</span></div>
        </div>

        <div class="resumen-calorias">
            <div class="subtitulo-calorias">CALORÍAS RESTANTES</div>
            <div class="numero-calorias" id="caloriasRestantes">0</div>
            <div class="subtitulo-calorias">Consumidas: <span id="caloriasConsumidas">0</span> / <span id="caloriasTotales">0</span> kcal</div>
        </div>

        <div class="contenedor-macros">
            <div class="macro-linea">
                <div class="macro-info"><span>Proteínas (P)</span><span id="txtProteina">0 / 0g</span></div>
                <div class="barra-progreso-bg"><div id="barraP" class="barra-progreso-fill p-fill"></div></div>
            </div>
            <div class="macro-linea">
                <div class="macro-info"><span>Carbohidratos (C)</span><span id="txtCarbo">0 / 0g</span></div>
                <div class="barra-progreso-bg"><div id="barraC" class="barra-progreso-fill c-fill"></div></div>
            </div>
            <div class="macro-linea">
                <div class="macro-info"><span>Grasas (G)</span><span id="txtGrasa">0 / 0g</span></div>
                <div class="barra-progreso-bg"><div id="barraG" class="barra-progreso-fill g-fill"></div></div>
            </div>
        </div>

        <div id="listaComidas" class="lista-comidas"></div>

        <div class="seccion-registro">
            <textarea class="textarea-ia" id="txtComidaIA" placeholder="Describe lo que comiste (Ej: 200g de pollo asado con una taza de arroz y aguacate)..."></textarea>
            <button onclick="procesarComidaIA()">Registrar con IA</button>
            <button onclick="borrarDatos()" style="background-color: #444; font-size: 11px; padding: 6px; margin-top: 15px;">Restablecer Aplicación</button>
        </div>
    </div>
</div>

<script>

    let registrosDiarios = JSON.parse(localStorage.getItem('caloria_registros')) || { calorias: 0, p: 0, c: 0, g: 0, comidas: [] };

        if (datosUsuario) {
            mostrarDashboard();
        }
    };
