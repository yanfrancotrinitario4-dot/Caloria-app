<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CalorIA - Inteligente</title>
    <style>
        :root { --bg: #0d0d1a; --card: #121226; --pink: #e91e63; --green: #009688; }
        body { background-color: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .contenedor { background-color: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
        .pestanas { display: flex; gap: 5px; margin-bottom: 15px; }
        .btn-p { padding: 8px; font-size: 11px; flex: 1; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-p.active { background: var(--pink); }
        textarea { width: 100%; padding: 10px; background: #1a1a3a; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 10px; }
        .acciones { display: flex; gap: 10px; }
        button#btnRegistrar { flex: 2; padding: 12px; background: var(--pink); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        label#btnCamaraGaleria { flex: 1; background: var(--green); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
        .item-comida { background: #1a1a3a; padding: 10px; margin-top: 10px; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h3>CalorIA</h3>
    <div class="pestanas">
        <button class="btn-p active" onclick="setCat(this, 'Desayuno')">Desayuno</button>
        <button class="btn-p" onclick="setCat(this, 'Almuerzo')">Almuerzo</button>
        <button class="btn-p" onclick="setCat(this, 'Cena')">Cena</button>
        <button class="btn-p" onclick="setCat(this, 'Merienda')">Merienda</button>
    </div>

    <textarea id="textoComida" rows="3" placeholder="Describe tu comida o sube una foto..."></textarea>

    <div class="acciones">
        <button id="btnRegistrar" onclick="registrarTexto()">Registrar Texto</button>
        <label id="btnCamaraGaleria">📷
            <!-- accept="image/*" permite tanto cámara como galería -->
            <input type="file" accept="image/*" onchange="registrarFoto(event)" style="display: none;">
        </label>
    </div>

    <div id="listaDiaria"></div>
</div>

<script>
    let categoria = 'Desayuno';
    let db = JSON.parse(localStorage.getItem('caloria_db')) || {};

    function setCat(btn, cat) {
        categoria = cat;
        document.querySelectorAll('.btn-p').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Registrar por escrito
    function registrarTexto() {
        let desc = document.getElementById('textoComida').value;
        guardarEnDB(desc + " (Calculado por texto)");
    }

    // Registrar mediante cámara o galería
    function registrarFoto(e) {
        if (e.target.files && e.target.files[0]) {
            // Aquí es donde llamarías a la IA (Google Gemini API)
            // Por ahora, simulamos el análisis de la IA:
            let simulacionIA = "Comida detectada: Estimación IA -> 450 kcal";
            guardarEnDB(simulacionIA);
        }
    }

    function guardarEnDB(descripcion) {
        let hoy = new Date().toISOString().split('T')[0];
        if (!db[hoy]) db[hoy] = [];
        db[hoy].push({ cat: categoria, desc: descripcion });
        localStorage.setItem('caloria_db', JSON.stringify(db));
        document.getElementById('textoComida').value = '';
        render();
    }

    function render() {
        let hoy = new Date().toISOString().split('T')[0];
        document.getElementById('listaDiaria').innerHTML = (db[hoy] || []).map(i => 
            `<div class="item-comida"><b>[${i.cat}]</b> ${i.desc}</div>`).join('');
    }

    render();
</script>
</body>
</html>
